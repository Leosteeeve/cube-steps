<script>
const clubLogo=document.querySelector('.brand svg').innerHTML;
const globalLogo='<path fill="#173f34" d="M50 4 96 30v56l-46 27L4 86V30Z"/><path fill="#72bc97" d="m50 12 36 21-36 21-36-21Z"/><path fill="#f2faf5" d="m12 40 34 20v43L12 83Z"/><path fill="#2b8967" d="m54 60 34-20v43l-34 20Z"/><path fill="none" stroke="#173f34" stroke-width="3" d="m26 26 36 21m12-21L38 47M29 50v43m-17-32 34 20m24-30v43m-16-13 34-20"/>';
const state={style:'open',global:false,page:'home',step:0,playing:false,speed:1,highlight:true,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches,route:0,tab:'compare',orient:'eight'};
let cleanupCube=()=>{},playTimeout=0,toastTimeout=0;
const moves=['U','R','U′','R′'];
const lessons=[
 {title:'See the pair before you turn.',sub:'01 / Observe',text:'Keep your left block in view. Track the two outlined pieces together before choosing the next move.',why:'Plan beyond the first block.',reason:'An extra move can be worthwhile when it leaves an easy start for the right block.',check:'Look for connected pieces',result:'A useful pair stays connected as you move it. The completed left block remains your reference.'},
 {title:'Bring the pair into view.',sub:'02 / Set up',text:'Watch how the upper layer changes the available working space. Keep the cube in the same holding position.',why:'A setup move has a purpose.',reason:'The explanation should identify the pieces and the space being prepared, so you can follow with a real cube.',check:'Pause and look',result:'Check the target pieces before moving on. The example animation here is for evaluating the interface.'},
 {title:'Follow one move at a time.',sub:'03 / Try the move',text:'The active move stays beside the cube. Step back whenever you want to see what changed.',why:'Less searching, more observing.',reason:'Holding, the current turn and the explanation remain visible together. Reference details are available below.',check:'Keep your reference',result:'Camera dragging changes the view only. An actual cube rotation will appear as its own move in the player.'},
 {title:'Watch the connection.',sub:'04 / Follow through',text:'Use the outline to keep track of the selected pieces, even when they move to another face.',why:'Color is not the only cue.',reason:'A crisp outline and a face label help distinguish targets without washing out the rest of the cube.',check:'Inspect the result',result:'The finished version will check the actual solver state and explain which pieces should now match.'},
 {title:'Check before continuing.',sub:'05 / Result',text:'Replay the sequence slowly, or return to its starting position. You can always revisit the reason for each turn.',why:'Understanding comes first.',reason:'The final lesson will use a real case with its own recognition, setup and checkpoint, shared with the solver.',check:'Ready for the next idea',result:'This is an interaction study. The four-move demonstration is not an Advanced Roux solution.'}
];
function footer(){return '<footer class="demo-banner"><div><strong>Interactive design study.</strong> Cube controls work. Lessons, routes and numbers are illustrative; no experimental solver is running.</div><span>Global preview compares styling only · New Roux features are planned for the club first</span></footer>'}
function canvas(id='cube'){return `<canvas class="cube-canvas" id="${id}" aria-label="Interactive cube preview; drag to change the camera view"></canvas>`}
function home(){return `<section class="hero"><div><div class="eyebrow">${state.global?'Learn the cube. Understand every move.':'Made for curious minds'}</div><h1>A small cube.<br>A whole new<br><span>way to think.</span></h1><p>Find your first solve. Build a smoother one.<br>A place to learn, try things, and get a little better.</p><div class="hero-actions"><button class="btn" data-page="learn">Find your route <span>↗</span></button><button class="btn secondary" data-page="learn">Continue learning <span>→</span></button></div><div class="hero-foot"><div class="avatars"><span class="avatar">W</span><span class="avatar">C</span><span class="avatar">C</span></div><span>${state.global?'Free to explore. No account needed.':'Learn together. Practice at your own pace.'}</span></div></div><div class="hero-art"><span class="art-label">A little movement. A new perspective.</span>${canvas()}<div class="art-footer"><span><strong>See it. Try it. Understand it.</strong><br>Drag the cube to explore.</span><button id="motionButton" class="motion-toggle">${state.motion?'Pause motion':'Enable motion'}</button></div></div></section><section class="home-section"><div class="section-title"><div><h2>What would you like to try?</h2><p>One clear next step, wherever you are now.</p></div><button class="link-button" data-page="learn">Explore learning →</button></div><div class="path-grid"><button class="path" data-page="learn"><div class="path-head"><span class="path-icon">✧</span><small>Start here</small></div><h3>Your first full solve</h3><p>Learn the moves, make a white daisy, and build your confidence.</p><span class="arrow">↗</span></button><button class="path" data-page="learn"><div class="path-head"><span class="path-icon">▧</span><small>Find your rhythm</small></div><h3>Build with Roux</h3><p>Think in blocks. Explore the middle slice. See how the pieces connect.</p><span class="arrow">↗</span></button><button class="path" data-page="lab"><div class="path-head"><span class="path-icon">⌁</span><small>Try an experiment</small></div><h3>One cube. More routes.</h3><p>Compare block choices in the lab, then see what feels right in your hands.</p><span class="arrow">↗</span></button></div><div class="home-note"><span>◷</span><span>A few minutes today is a good start. Your practice tools are always one click away.</span></div></section>${footer()}`}
function panel(){return `<div class="player-column"><div class="cube-panel"><div class="cube-topbar"><div class="hold"><i class="dot white"></i> White down <span>·</span><i class="dot blue"></i> Blue left</div><span class="tag">Fixed holding</span></div><div class="cube-stage">${canvas()}<button class="target-toggle" id="highlightButton" aria-pressed="${state.highlight}">${state.highlight?'◉ Targets on':'○ Targets off'}</button><div class="view-label">Front / left view · Drag to look around</div></div><div class="move-strip"><small>Demo<br>sequence</small>${moves.map((m,i)=>`<button data-move="${i+1}" class="${state.step===i+1?'active':''}" aria-label="Jump to move ${i+1}: ${m}">${m}</button>`).join('')}</div><div class="progress-track"><div class="progress-fill" style="width:${state.step/4*100}%"></div></div><div class="transport"><div class="transport-buttons"><button class="round" id="resetButton" aria-label="Restart sequence">↺</button><button class="round" id="previousButton" aria-label="Previous move" ${state.step===0?'disabled':''}>‹</button><button class="round play" id="playButton" aria-label="${state.playing?'Pause':'Play'}">${state.playing?'Ⅱ':'▶'}</button><button class="round" id="nextButton" aria-label="Next move" ${state.step===4?'disabled':''}>›</button></div><span class="counter" aria-live="polite">${state.step} / 4</span><label>Speed <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label></div></div><div class="under-player"><span>Camera movement does not turn the cube.</span><button id="viewButton">Reset view ↺</button></div></div>`}
function note(){let l=lessons[state.step];return `<aside class="lesson-note" id="lessonNote"><div class="sub">${l.sub}</div><h2>${l.title}</h2><p>${l.text}</p><div class="reason"><strong>${l.why}</strong><p>${l.reason}</p></div><div class="checkpoint"><strong>✓ &nbsp;${l.check}</strong><p>${l.result}</p></div><details><summary>Formula & holding reference</summary><p>This preview uses U R U′ R′ to demonstrate playback. In the product, each case will have its own validated formula, actual rotations and holding instructions.</p></details></aside>`}
function learn(){return `<div class="page-heading"><div><div class="eyebrow">Learn / Advanced Roux</div><h1>Build a connection.</h1><p>First block · See useful pairs before choosing a route.</p></div><div class="heading-actions"><button class="btn small secondary" data-info="This drawer will contain scramble input, six-face entry and solve options.">Use my cube</button><button class="btn small secondary" data-info="Keep Beginner Roux available alongside the advanced course.">Change course ↓</button></div></div><div class="workspace"><aside class="stage-nav"><div class="rail-heading">Your learning path</div>${['Holding & notation','First block','Second block','CMLL','EOLR & last edges'].map((t,i)=>`<button class="stage-item ${i===1?'active':''}" data-stage="${i}"><span class="stage-num">${i===0?'✓':String(i).padStart(2,'0')}</span><span>${t}</span></button>`).join('')}<div class="rail-divider"></div><p class="rail-caption">A new method, one idea at a time.<br><br>Beginner steps stay within reach.</p></aside>${panel()}${note()}</div>${footer()}`}
const routes=[{name:'Keep the pair connected',label:'Recommended',first:8,second:11,rot:0,note:'One extra first-block move; a clearer start for the right block.'},{name:'Shortest first block',label:'Reference',first:7,second:15,rot:1,note:'Fewer moves up front; more work to set up the next block.'},{name:'Start from the yellow side',label:'Alternative',first:8,second:12,rot:0,note:'A different starting orientation with a useful premade pair.'}];
function routeCard(r,i){return `<button class="route ${state.route===i?'active':''}" data-route="${i}" aria-pressed="${state.route===i}"><div class="route-top"><span>${i===2?'◉ Yellow / red':'◉ White / blue'}</span><span class="tag ${i===0?'blue':''}">${r.label}</span></div><h3>${r.name}</h3><p>${r.note}</p><div class="route-stats"><div><strong>${r.first}</strong><small>First block</small></div><div><strong>${r.second}</strong><small>Second block</small></div><div><strong>${r.rot}</strong><small>Rotations</small></div></div></button>`}
function lab(){return `<div class="page-heading lab-head"><div><div class="eyebrow">Roux Test Lab / Experimental</div><h1>A better route is more than fewer moves.</h1><p>Compare the whole block-building sequence. Let your hands have the final say.</p><div class="experiment-note"><i></i>Illustrative sample · Scores are not measured speed</div></div><button class="btn small secondary" data-info="The product will import and export an experiment with routes and physical trial notes.">Experiment file ↓</button></div><div class="lab-tabs">${['analyze','compare','trials'].map(t=>`<button data-tab="${t}" class="${state.tab===t?'active':''}">${t==='trials'?'Trials & notes':t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${state.tab==='trials'?trials():`<div class="analysis-config"><div><strong>${state.tab==='analyze'?'Choose how to explore.':'Two bottom colors. Eight starting orientations.'}</strong><p>${state.tab==='analyze'?'Use a scramble or your own cube, then compare possible block starts.':'White or yellow down, with four possible left-side colors for each.'}</p><div class="orientation-options"><button data-orient="eight" class="${state.orient==='eight'?'active':''}">All eight</button><button data-orient="fixed" class="${state.orient==='fixed'?'active':''}">White / blue only</button><button data-info="The finished version will let you include or exclude individual starting orientations.">Choose colors…</button></div></div><button class="btn small" id="sampleButton">${state.tab==='analyze'?'Open sample comparison':'New analysis'} ↗</button></div><div class="lab-layout"><div><div class="route-stack">${routes.map(routeCard).join('')}</div><p class="lab-footnote">Example values only. A shortest-first-block claim will require a completed search proof. Other recommendations will show search limits and scoring factors.</p></div><div class="lab-view">${panel()}<aside class="lesson-note"><div class="sub">Why this route?</div><h2 id="routeTitle">${routes[state.route].name}.</h2><p id="routeReason">${routes[state.route].note}</p><div class="reason"><strong>Look one block ahead.</strong><p>Preserve useful connections, keep targets visible, and avoid unnecessary regrips.</p></div><div class="checkpoint"><strong>Try it on your cube</strong><p>The final lab will compare actual candidates and record what feels smooth or awkward.</p></div><button class="link-button" data-tab="trials">Open physical trials →</button><p style="font-size:10px;margin-top:12px">All sample routes share the same four-move UI demonstration.</p></aside></div></div>`}${footer()}`}
function trials(){return `<div class="trial-grid"><section class="trial-panel"><div class="eyebrow">Your hands are the test</div><h2 style="margin-top:18px">Record what feels different.</h2><p>Compare the same starting cube with each route. Keep measured time separate from the algorithm's estimated score.</p><label>Selected route<input value="${routes[state.route].name}" readonly></label><label>Block-building time (seconds)<input inputmode="decimal" placeholder="e.g. 12.48" aria-label="Block-building time"></label><label>What felt smooth or awkward?<textarea rows="3" placeholder="Where did you pause, regrip, or lose track of a piece?"></textarea></label><button class="btn small" style="margin-top:20px" data-info="Preview only: no trial is saved. Local storage and experiment export belong to implementation.">Save trial</button></section><section class="trial-panel"><h2>Compare like with like.</h2><p>A useful result includes more than a number.</p><ul><li>Use the same scramble for each route.</li><li>Try each route more than once.</li><li>Separate recognition from execution.</li><li>Note helpful rotations and awkward grips.</li><li>Keep your usual dominant hand in mind.</li></ul><div class="checkpoint"><strong>Local by default</strong><p>The planned lab keeps records on your device, with explicit import and export for sharing.</p></div></section></div>`}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('visible');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('visible'),4500)}
function render(){cleanupCube();document.body.className=[state.style==='focus'?'focus':'',state.global?'global':''].join(' ');document.querySelector('#main').innerHTML=(state.page==='home'?home():state.page==='learn'?learn():lab());document.querySelector('#main').classList.remove('fade-in');requestAnimationFrame(()=>document.querySelector('#main').classList.add('fade-in'));document.querySelectorAll('[data-style]').forEach(e=>{e.classList.toggle('active',e.dataset.style===state.style);e.setAttribute('aria-pressed',String(e.dataset.style===state.style))});document.querySelectorAll('.nav [data-page]').forEach(e=>e.classList.toggle('active',e.dataset.page===state.page));document.querySelector('.brand svg').innerHTML=state.global?globalLogo:clubLogo;document.querySelector('#brandName').textContent=state.global?'CubeSteps':'Webb Cubing Club';document.querySelector('#brandSub').textContent=state.global?'Understand every move.':'A little curiosity. A new skill.';document.querySelector('#themeButton').textContent=state.global?'Preview club blue ↗':'Preview global green ↗';if(document.querySelector('#speed'))document.querySelector('#speed').value=String(state.speed);let c=document.querySelector('#cube');if(c)cleanupCube=mountCube(c);else cleanupCube=()=>{};}
function stop(){state.playing=false;clearTimeout(playTimeout)}
function setStep(step,animate=true){state.step=Math.max(0,Math.min(4,step));window.cubeDemo?.go(state.step,animate);document.querySelectorAll('[data-move]').forEach(e=>e.classList.toggle('active',Number(e.dataset.move)===state.step));let fill=document.querySelector('.progress-fill'),counter=document.querySelector('.counter'),prev=document.querySelector('#previousButton'),next=document.querySelector('#nextButton');if(fill)fill.style.width=state.step/4*100+'%';if(counter)counter.textContent=state.step+' / 4';if(prev)prev.disabled=state.step===0;if(next)next.disabled=state.step===4;let noteEl=document.querySelector('#lessonNote');if(noteEl)noteEl.outerHTML=note();}
function play(){if(state.playing){stop();document.querySelector('#playButton').textContent='▶';return}state.playing=true;if(state.step===4)setStep(0,false);document.querySelector('#playButton').textContent='Ⅱ';let tick=()=>{if(!state.playing)return;if(state.step===4){stop();document.querySelector('#playButton').textContent='▶';return}setStep(state.step+1);playTimeout=setTimeout(tick,1300/state.speed)};tick()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style){state.style=b.dataset.style;render();return}if(b.id==='themeButton'){state.global=!state.global;render();return}if(b.dataset.page){stop();state.page=b.dataset.page;state.step=0;render();window.scrollTo({top:0,behavior:'instant'});return}if(b.dataset.info){toast(b.dataset.info);return}if(b.dataset.move){stop();setStep(Number(b.dataset.move));document.querySelector('#playButton').textContent='▶';return}if(b.dataset.stage){toast('This design preview shows the first-block lesson. The finished course will also cover CMLL and advanced LSE.');return}if(b.dataset.tab){stop();state.tab=b.dataset.tab;render();return}if(b.dataset.route){stop();state.route=Number(b.dataset.route);state.step=0;render();return}if(b.dataset.orient){state.orient=b.dataset.orient;render();toast('Preview setting changed. Sample route values are illustrative, not recalculated.');return}if(b.id==='sampleButton'){state.tab=state.tab==='analyze'?'compare':'analyze';render();return}if(b.id==='highlightButton'){state.highlight=!state.highlight;b.textContent=state.highlight?'◉ Targets on':'○ Targets off';b.setAttribute('aria-pressed',String(state.highlight));return}if(b.id==='motionButton'){state.motion=!state.motion;b.textContent=state.motion?'Pause motion':'Enable motion';return}if(b.id==='viewButton'){window.cubeDemo?.resetView();return}if(b.id==='resetButton'){stop();setStep(0);document.querySelector('#playButton').textContent='▶';return}if(b.id==='previousButton'){stop();setStep(state.step-1);document.querySelector('#playButton').textContent='▶';return}if(b.id==='nextButton'){stop();setStep(state.step+1);document.querySelector('#playButton').textContent='▶';return}if(b.id==='playButton'){play();return}});
document.addEventListener('change',e=>{if(e.target.id==='speed')state.speed=Number(e.target.value)});

 const color={U:'#ffdc4e',D:'#fafbff',F:'#ed6657',B:'#f4a343',L:'#4b8de8',R:'#54ba8c'};
 const faces=[['U',[0,1,0]],['D',[0,-1,0]],['F',[0,0,1]],['B',[0,0,-1]],['L',[-1,0,0]],['R',[1,0,0]]];
 const rotate=(p,axis,a)=>{let q=[...p],c=Math.cos(a),s=Math.sin(a),i=(axis+1)%3,j=(axis+2)%3;q[i]=p[i]*c-p[j]*s;q[j]=p[i]*s+p[j]*c;return q};
 function stickers(){let arr=[];for(let [face,n] of faces){let axis=n.findIndex(v=>v!==0),i=(axis+1)%3,j=(axis+2)%3;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){let p=n.map(v=>v*1.5),poly=[];p[i]=a;p[j]=b;for(let [di,dj] of [[-1,-1],[1,-1],[1,1],[-1,1]]){let q=[...p];q[i]+=.455*di;q[j]+=.455*dj;poly.push(q)}arr.push({poly,n:[...n],p,face,label:a===0&&b===0?face:'',target:face==='L'&&a===0&&b===0||face==='F'&&a===1&&b===0})}}return arr}
 const seq=[[1,1,-Math.PI/2],[0,1,-Math.PI/2],[1,1,Math.PI/2],[0,1,Math.PI/2]];
 function turn(arr,m,a){for(let s of arr)if(s.p[m[0]]*m[1]>.52){s.p=rotate(s.p,m[0],a);s.n=rotate(s.n,m[0],a);s.poly=s.poly.map(p=>rotate(p,m[0],a))}}
 function posed(step){let arr=stickers();for(let i=0;i<step;i++)turn(arr,seq[i],seq[i][2]);return arr}
 function orient(p,y,pi){return rotate(rotate(p,1,y),0,pi)}
 function draw(t){if(!alive)return;let dt=Math.min(40,t-(lastTime||t));lastTime=t;let isHome=state.page==='home';if(isHome&&state.motion&&!drag&&!reduced)autoClock+=dt;
 let arr=posed(toStep),elapsed=(t-animStart)/(530/state.speed),progress=Math.max(0,Math.min(1,elapsed));if(fromStep!==toStep&&progress<1){let ease=progress<.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2;if(Math.abs(toStep-fromStep)===1){arr=posed(fromStep);let ix=Math.min(toStep,fromStep);turn(arr,seq[ix],seq[ix][2]*(toStep>fromStep?ease:-ease));}}
 if(isHome){arr=stickers();let cyc=autoClock%9000,amount=cyc<2300?0:cyc<3600?(cyc-2300)/1300:cyc<5500?1:cyc<6800?1-(cyc-5500)/1300:0;let ease=amount*amount*(3-2*amount);turn(arr,seq[0],-Math.PI/2*ease)}
 ctx.clearRect(0,0,w,h);let dark=state.style==='focus';let cy=h*(isHome?.5:.49),scale=Math.min(w*.69,h*.72)/4.05;let y=yaw+(isHome&&state.motion&&!reduced?Math.sin(autoClock/3400)*.07:0),pi=pitch;
 let shadow=ctx.createRadialGradient(w*.5,h*.81,5,w*.5,h*.81,w*.25);shadow.addColorStop(0,dark?'#00000022':'#24446a20');shadow.addColorStop(1,'#00000000');ctx.fillStyle=shadow;ctx.beginPath();ctx.ellipse(w*.5,h*.81,w*.28,h*.06,0,0,Math.PI*2);ctx.fill();
 let visible=arr.map(s=>({...s,points:s.poly.map(p=>orient(p,y,pi)),normal:orient(s.n,y,pi),center:orient(s.p,y,pi)})).filter(s=>s.normal[2]>.02).sort((a,b)=>a.center[2]-b.center[2]);
 function project(p){let f=7/(7-p[2]*.12);return [w/2+p[0]*scale*f,cy-p[1]*scale*f]}
 for(let s of visible){let pts=s.points.map(project);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#162d40';ctx.stroke();ctx.fillStyle=color[s.face];ctx.fill();let shade=Math.max(0,.22-s.normal[1]*.11-s.normal[2]*.04);ctx.fillStyle=`rgba(10,25,46,${shade})`;ctx.fill();if(!isHome&&state.highlight&&s.target){ctx.lineWidth=2.4;ctx.strokeStyle='#fff';ctx.stroke()}if(s.label){let p=project(s.center);ctx.font=`600 ${Math.max(10,scale*.24)}px 'Segoe UI',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=s.face==='U'?'#5c4c1bb0':'#ffffffc5';ctx.fillText(s.label,...p)}}
 raf=requestAnimationFrame(draw)}
 const resize=()=>{let r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)};let obs=new ResizeObserver(resize);obs.observe(canvas);resize();
 const down=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)},move=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY]},up=()=>drag=null;
 canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
 window.cubeDemo={go(step,animate){fromStep=toStep;toStep=step;animStart=animate&&!reduced?performance.now():-10000},resetView(){yaw=.62;pitch=.42}};
 raf=requestAnimationFrame(draw);return ()=>{alive=false;cancelAnimationFrame(raf);obs.disconnect();canvas.removeEventListener('pointerdown',down);canvas.removeEventListener('pointermove',move);canvas.removeEventListener('pointerup',up);canvas.removeEventListener('pointercancel',up)};
}
render();
</script>
